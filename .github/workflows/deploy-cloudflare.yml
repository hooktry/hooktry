name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ORTYO_CLAIM_INTERNAL_TOKEN: ${{ secrets.ORTYO_CLAIM_INTERNAL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -u
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ORTYO_CLAIM_INTERNAL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare adapter
        run: npm run check

      - name: Ensure production resources
        id: bootstrap
        run: node scripts/ensure-production-resources.mjs

      - name: Apply D1 migrations
        run: >
          npx wrangler d1 migrations apply ortyo-cloudflare
          --remote
          --config wrangler.production.generated.jsonc

      - name: Deploy Worker and Durable Object
        run: npx wrangler deploy --config wrangler.production.generated.jsonc

      - name: Install internal claim secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ORTYO_CLAIM_INTERNAL_TOKEN" |
            npx wrangler secret put CLAIM_INTERNAL_TOKEN --config wrangler.production.generated.jsonc

      - name: Production acceptance
        env:
          ORTYO_BASE_URL: ${{ steps.bootstrap.outputs.base_url }}
          ORTYO_D1_DATABASE_ID: ${{ steps.bootstrap.outputs.database_id }}
        run: node scripts/smoke-production.mjs
