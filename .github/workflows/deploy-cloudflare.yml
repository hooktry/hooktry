name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: deploy production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudflare
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      HOOKTRY_CLAIM_INTERNAL_TOKEN: ${{ secrets.ORTYO_CLAIM_INTERNAL_TOKEN }}
      HOOKTRY_USAGE_INGEST_TOKEN: ${{ secrets.ORTYO_USAGE_INGEST_TOKEN }}

    steps:
      - name: Verify manual deploy source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Manual production deploys are main-only."
            exit 1
          fi
          successful="$(gh api             "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&status=success&per_page=1"             --jq '.total_count')"
          if [[ "${successful}" -lt 1 ]]; then
            echo "::error::No successful CI run exists for ${RELEASE_SHA}."
            exit 1
          fi

      - name: Checkout proven release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -u
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HOOKTRY_CLAIM_INTERNAL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Resolve source PR
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(git log -1 --pretty=%B | sed -nE 's/.*\(#([0-9]+)\).*/\1/p' | head -n1)"
          if [[ -n "$pr_number" ]]; then
            echo "VITE_BUILD_PR=$pr_number" >> "$GITHUB_ENV"
            echo "Resolved source PR #$pr_number"
          else
            echo "No source PR number found in commit message"
          fi

      - name: Build shared web assets
        working-directory: apps/web
        env:
          VITE_BUILD_SHA: ${{ env.RELEASE_SHA }}
          VITE_BUILD_PR: ${{ env.VITE_BUILD_PR }}
        run: npm run build

      - name: Install Cloudflare dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply D1 migrations
        run: >
          npx wrangler d1 migrations apply ortyo-cloudflare
          --remote
          --config wrangler.production.jsonc

      - name: Deploy Worker and Durable Object
        shell: bash
        run: |
          set -euo pipefail
          args=(
            npx wrangler deploy
            --config wrangler.production.jsonc
            --var "HOOKTRY_RELEASE_SHA:${RELEASE_SHA}"
            --var "HOOKTRY_PUBLIC_ORIGIN:https://hooktry.com"
          )
          if [[ -n "${GITHUB_CLIENT_ID:-}" ]]; then
            args+=(--var "GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID}")
          fi
          "${args[@]}"

      - name: Install optional usage ingest secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOOKTRY_USAGE_INGEST_TOKEN:-}" ]]; then
            printf '%s' "$HOOKTRY_USAGE_INGEST_TOKEN" |
              npx wrangler secret put USAGE_INGEST_TOKEN --config wrangler.production.jsonc
          else
            echo "HOOKTRY_USAGE_INGEST_TOKEN is not configured; usage ingest remains disabled."
          fi

      - name: Production acceptance
        env:
          HOOKTRY_BASE_URL: https://ortyo-cloudflare.web33.workers.dev
          HOOKTRY_D1_DATABASE_ID: 60eaa4ee-ce8d-4663-99c6-1df794ec47f8
          HOOKTRY_R2_BUCKET: ortyo-payloads
          HOOKTRY_MCP_URL: https://mcp.hooktry.com/mcp
          HOOKTRY_PUBLIC_ORIGIN: https://hooktry.com
          HOOKTRY_EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          HOOKTRY_EXPECT_GITHUB_AUTH: ${{ vars.GITHUB_CLIENT_ID != '' && '1' || '0' }}
          HOOKTRY_USAGE_INGEST_TOKEN: ${{ secrets.ORTYO_USAGE_INGEST_TOKEN }}
        run: node scripts/smoke-production.mjs
