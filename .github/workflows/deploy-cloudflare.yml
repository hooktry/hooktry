name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      HOOKTRY_CLAIM_INTERNAL_TOKEN: ${{ secrets.ORTYO_CLAIM_INTERNAL_TOKEN }}
      HOOKTRY_USAGE_INGEST_TOKEN: ${{ secrets.ORTYO_USAGE_INGEST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -u
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HOOKTRY_CLAIM_INTERNAL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build shared web assets
        working-directory: apps/web
        run: npm run check

      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare adapter
        run: npm run check

      - name: Apply D1 migrations
        run: >
          npx wrangler d1 migrations apply ortyo-cloudflare
          --remote
          --config wrangler.production.jsonc

      - name: Deploy Worker and Durable Object
        shell: bash
        run: |
          set -euo pipefail
          args=(
            npx wrangler deploy
            --config wrangler.production.jsonc
            --var "HOOKTRY_RELEASE_SHA:${GITHUB_SHA}"
            --var "HOOKTRY_PUBLIC_ORIGIN:https://hooktry.com"
          )
          if [[ -n "${GITHUB_CLIENT_ID:-}" ]]; then
            args+=(--var "GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID}")
          fi
          "${args[@]}"

      - name: Install optional usage ingest secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOOKTRY_USAGE_INGEST_TOKEN:-}" ]]; then
            printf '%s' "$HOOKTRY_USAGE_INGEST_TOKEN" |
              npx wrangler secret put USAGE_INGEST_TOKEN --config wrangler.production.jsonc
          else
            echo "HOOKTRY_USAGE_INGEST_TOKEN is not configured; usage ingest remains disabled."
          fi

      - name: Production acceptance
        env:
          HOOKTRY_BASE_URL: https://ortyo-cloudflare.web33.workers.dev
          HOOKTRY_D1_DATABASE_ID: 60eaa4ee-ce8d-4663-99c6-1df794ec47f8
          HOOKTRY_R2_BUCKET: ortyo-payloads
          HOOKTRY_MCP_URL: https://mcp.hooktry.com/mcp
          HOOKTRY_PUBLIC_ORIGIN: https://hooktry.com
          HOOKTRY_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          HOOKTRY_EXPECT_GITHUB_AUTH: ${{ vars.GITHUB_CLIENT_ID != '' && '1' || '0' }}
          HOOKTRY_USAGE_INGEST_TOKEN: ${{ secrets.ORTYO_USAGE_INGEST_TOKEN }}
        run: node scripts/smoke-production.mjs
