name: Bootstrap Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-cloudflare-production
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
      HOOKTRY_CLAIM_INTERNAL_TOKEN: ${{ secrets.ORTYO_CLAIM_INTERNAL_TOKEN }}
      HOOKTRY_USAGE_INGEST_TOKEN: ${{ secrets.ORTYO_USAGE_INGEST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate bootstrap credentials
        shell: bash
        run: |
          set -u
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET HOOKTRY_CLAIM_INTERNAL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build shared web assets
        working-directory: apps/web
        run: npm run check

      - name: Install Cloudflare dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare adapter
        run: npm run check

      - name: Bootstrap production resources
        id: bootstrap
        run: node scripts/bootstrap-production-resources.mjs

      - name: Apply D1 migrations
        run: >
          npx wrangler d1 migrations apply hooktry-cloudflare
          --remote
          --config wrangler.production.generated.jsonc

      - name: Deploy Worker and Durable Object
        run: >
          npx wrangler deploy
          --config wrangler.production.generated.jsonc
          --var "HOOKTRY_RELEASE_SHA:${GITHUB_SHA}"
          --var "GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID}"

      - name: Install runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HOOKTRY_CLAIM_INTERNAL_TOKEN" |
            npx wrangler secret put CLAIM_INTERNAL_TOKEN --config wrangler.production.generated.jsonc
          printf '%s' "$GITHUB_CLIENT_SECRET" |
            npx wrangler secret put GITHUB_CLIENT_SECRET --config wrangler.production.generated.jsonc
          if [[ -n "${HOOKTRY_USAGE_INGEST_TOKEN:-}" ]]; then
            printf '%s' "$HOOKTRY_USAGE_INGEST_TOKEN" |
              npx wrangler secret put USAGE_INGEST_TOKEN --config wrangler.production.generated.jsonc
          else
            echo "HOOKTRY_USAGE_INGEST_TOKEN is not configured; usage ingest remains disabled."
          fi

      - name: Production acceptance
        env:
          HOOKTRY_BASE_URL: ${{ steps.bootstrap.outputs.base_url }}
          HOOKTRY_D1_DATABASE_ID: ${{ steps.bootstrap.outputs.database_id }}
          HOOKTRY_R2_BUCKET: hooktry-payloads
          HOOKTRY_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          HOOKTRY_EXPECT_GITHUB_AUTH: "1"
          HOOKTRY_USAGE_INGEST_TOKEN: ${{ secrets.ORTYO_USAGE_INGEST_TOKEN }}
        run: node scripts/smoke-production.mjs

      - name: Verify checked-in production config still matches D1
        shell: bash
        env:
          BOOTSTRAPPED_D1_DATABASE_ID: ${{ steps.bootstrap.outputs.database_id }}
        run: |
          set -euo pipefail
          CONFIGURED_D1_DATABASE_ID="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("wrangler.production.jsonc", "utf8")).d1_databases[0].database_id)')"
          if [[ "$CONFIGURED_D1_DATABASE_ID" != "$BOOTSTRAPPED_D1_DATABASE_ID" ]]; then
            echo "::error::Production D1 id changed. Update apps/cloudflare/wrangler.production.jsonc before ordinary deploys."
            exit 1
          fi
