name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Snapshot immutability on pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          invalid="$(git diff --name-status "${BASE_SHA}" HEAD -- 'docs/market/snapshots/*.yaml' 'docs/market/snapshots/*.yml' | grep -Ev '^A[[:space:]]' || true)"
          if [[ -n "${invalid}" ]]; then
            echo "Existing market snapshots are immutable. Add a new snapshot instead:"
            echo "${invalid}"
            exit 1
          fi

      - name: Snapshot immutability on main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          invalid="$(git diff --name-status "${BASE_SHA}" HEAD -- 'docs/market/snapshots/*.yaml' 'docs/market/snapshots/*.yml' | grep -Ev '^A[[:space:]]' || true)"
          if [[ -n "${invalid}" ]]; then
            echo "Existing market snapshots are immutable. Add a new snapshot instead:"
            echo "${invalid}"
            exit 1
          fi

      - name: Install Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Workflow static validation
        run: >
          go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          -ignore 'configuration variable name "github_client_id" must not start with the GITHUB_ prefix'

      - name: Shell static validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-binary.sh
          shellcheck scripts/build-binary.sh

  web:
    name: web
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Web typecheck, tests, and build
        run: npm run check

      - name: Upload built web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: rust
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore built web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Market model
        run: cargo run --locked --bin market-model-check -- --check

      - name: Market snapshots
        run: cargo run --locked --bin market-snapshot-check -- --check

      - name: Market trend smoke
        run: >
          cargo run --locked --bin market-trend --
          --from docs/market/snapshots/2026-10-01-research-3.yaml
          --to docs/market/snapshots/2026-10-01-demand-1.yaml
          --json

      - name: Market research debt
        run: >
          cargo run --locked --bin market-research-debt --
          --limit 20
          --max-per-capability 3
          --json

      - name: First-party dogfood proof
        run: cargo test --locked --test first_party_dogfood_cli -- --nocapture

      - name: Live approval webhook Scenario proof
        run: cargo test --locked --test approval_webhook_scenario_dogfood -- --nocapture

      - name: Tests
        run: cargo test --locked --all-targets --all-features

  cloudflare:
    name: cloudflare
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore built web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cloudflare/package-lock.json

      - name: Install Cloudflare dependencies
        run: npm ci --no-audit --no-fund

      - name: Cloudflare typecheck and tests
        run: npm run check
