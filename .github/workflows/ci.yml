name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Market model
        run: cargo run --locked --bin market-model-check -- --check

      - name: Tests
        run: cargo test --locked --all-targets --all-features


  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund

      - name: Cloudflare typecheck and tests
        run: npm run check

  token_scope_probe:
    name: token scope probe
    if: github.event_name == 'pull_request' && github.head_ref == 'token1/least-privilege-production-ci'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect bootstrap token provisioning capability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/tokens/permission_groups`,
            { headers: { authorization: `Bearer ${token}` } },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success === false) {
            console.log(`TOKEN_PROVISIONING_ACCESS=false status=${response.status}`);
            for (const error of payload.errors ?? []) {
              console.log(`Cloudflare error ${error.code}: ${error.message}`);
            }
            process.exit(0);
          }

          console.log("TOKEN_PROVISIONING_ACCESS=true");
          const wanted = (payload.result ?? [])
            .filter((group) =>
              /Workers Scripts|D1|Workers R2 Storage|Account API Tokens/i.test(group.name),
            )
            .map((group) => ({
              id: group.id,
              name: group.name,
              scopes: group.scopes,
              is_selectable: group.is_selectable,
            }));
          console.log(JSON.stringify(wanted, null, 2));
          NODE

