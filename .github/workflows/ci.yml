name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features


  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund

      - name: Cloudflare typecheck and tests
        run: npm run check

  deploy_probe:
    name: deploy probe
    if: github.event_name == 'pull_request' && github.head_ref == 'deploy/ortyo-bootstrap-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORTYO_CLAIM_INTERNAL_TOKEN: ${{ secrets.ORTYO_CLAIM_INTERNAL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ORTYO_CLAIM_INTERNAL_TOKEN" || { echo "::error::Missing ORTYO_CLAIM_INTERNAL_TOKEN"; exit 1; }

      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare adapter
        run: npm run check

      - name: Ensure production resources
        id: bootstrap
        run: node scripts/ensure-production-resources.mjs

      - name: Apply D1 migrations
        run: >
          npx wrangler d1 migrations apply ortyo-cloudflare
          --remote
          --config wrangler.production.generated.jsonc

      - name: Deploy Worker and Durable Object
        run: npx wrangler deploy --config wrangler.production.generated.jsonc

      - name: Install internal claim secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ORTYO_CLAIM_INTERNAL_TOKEN" |
            npx wrangler secret put CLAIM_INTERNAL_TOKEN --config wrangler.production.generated.jsonc

      - name: Production acceptance
        env:
          ORTYO_BASE_URL: ${{ steps.bootstrap.outputs.base_url }}
          ORTYO_D1_DATABASE_ID: ${{ steps.bootstrap.outputs.database_id }}
        run: node scripts/smoke-production.mjs

