name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features


  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Cloudflare dependencies
        run: npm install --no-audit --no-fund

      - name: Cloudflare typecheck and tests
        run: npm run check

  cleanup_smoke_orphan:
    name: cleanup smoke orphan
    if: github.event_name == 'pull_request' && github.head_ref == 'deploy/cleanup-smoke-orphan'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete known orphaned smoke Exposure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = "60eaa4ee-ce8d-4663-99c6-1df794ec47f8";
          const exposureId = "01a0f793-fa8d-7406-9856-2027c54cc72a";

          async function query(sql, params = []) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}/query`,
              {
                method: "POST",
                headers: {
                  authorization: `Bearer ${token}`,
                  "content-type": "application/json",
                },
                body: JSON.stringify({ sql, params }),
              },
            );
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(JSON.stringify(payload.errors ?? payload));
            }
            return payload.result?.[0];
          }

          const deleted = await query(
            "DELETE FROM anonymous_exposures WHERE exposure_id = ? AND workspace_id IS NULL AND request_count = 0 AND retained_bytes = 0",
            [exposureId],
          );
          if (deleted?.meta?.changes !== 1) {
            throw new Error(`Expected to delete exactly one orphan; changes=${deleted?.meta?.changes ?? "unknown"}`);
          }

          const counts = await query(
            "SELECT (SELECT COUNT(*) FROM anonymous_exposures) AS exposures, (SELECT COUNT(*) FROM anonymous_interactions) AS interactions",
          );
          const row = counts?.results?.[0];
          if (!row || row.exposures !== 0 || row.interactions !== 0) {
            throw new Error(`Unexpected post-cleanup counts: ${JSON.stringify(row)}`);
          }

          console.log("Smoke orphan removed; D1 anonymous tables are empty");
          NODE

