checked_at: 2026-10-01
evidence_scope: "Public market evidence plus current Ortyo implementation; no first-party customer cohort yet."

priorities:
  - id: primary-inspector
    horizon: now
    decision: must
    confidence: high
    capabilities: [request-inspection, request-history, search-filter]
    rationale: "Primary-cohort table stakes plus direct demand for inspectable retained webhook evidence. Current Cloudflare viewer proves live flow but remains intentionally minimal."

  - id: capture-replay-loop
    horizon: now
    decision: must
    confidence: high
    capabilities: [replay, portable-recording, local-forwarding]
    rationale: "Repeated direct community evidence supports capture-once/replay-locally workflows and avoiding repeated real provider triggers."

  - id: configurable-sender-response
    horizon: now
    decision: must
    confidence: medium
    capabilities: [custom-response, failure-simulation]
    rationale: "Strong market prevalence and testing-job fit; direct public demand is weaker than for replay, so keep the first slice narrow."

  - id: provider-aware-testing
    horizon: next
    decision: should
    confidence: medium
    capabilities: [provider-templates, signature-verification, outbound-signing]
    rationale: "Signature fidelity causes real integration failures, but provider-native CLIs are substitutes. Build cross-provider adapters rather than a Stripe-specific clone."

  - id: deterministic-ci-proof
    horizon: next
    decision: differentiation
    confidence: medium
    capabilities: [wait-for-event, deterministic-ci, contracts, observation-window]
    rationale: "CI authentication, bounded waits, reproducible test environments, request assertions, and structured evidence are clearly present across competitors. Current evidence does not establish the same stable behavior-vs-infrastructure outcome semantics, so Ortyo should differentiate only where richer temporal/causal evidence improves the outcome; the exact DSL remains a hypothesis."

  - id: cardinality-ordering
    horizon: validate
    decision: differentiation
    confidence: low
    capabilities: [cardinality, ordering, correlation-context]
    rationale: "Competitors now show partial count, timestamp-order, bounded-wait, and suite semantics, but current evidence does not establish ranged cardinality with quiet-period proof, durable observed-order assertions, or normalized causal/idempotency matching. Direct demand for these exact deeper primitives is still not established."

  - id: reliable-delivery
    horizon: watch
    decision: watch
    confidence: medium
    capabilities: [durable-retries, dlq, fanout, filtering-routing, transformation]
    rationale: "Clearly validated market depth, but not yet validated as the next job for Ortyo users. Activate when development Hooks become long-lived pilots."

  - id: agent-control
    horizon: option
    decision: watch
    confidence: low
    capabilities: [approval-gate]
    rationale: "Agent operation is accelerating across competitors, but direct demand for approval-controlled actions inside the webhook development product is still missing."

  - id: managed-compute
    horizon: substrate
    decision: out_of_scope
    confidence: high
    capabilities: [managed-compute]
    rationale: "Managed compute should remain replaceable substrate unless it directly improves the webhook verification lifecycle."
