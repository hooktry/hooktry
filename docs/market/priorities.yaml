checked_at: 2026-10-04
evidence_scope: "Public market evidence plus S004/S007 contract, implementation, and executed E4 verification; Hooktry self-dogfood and Operational cross-project first-party portfolio usage; no external customer cohort yet."

priorities:
  - id: primary-inspector
    horizon: now
    decision: must
    confidence: high
    capabilities: [request-inspection, request-history, search-filter]
    rationale: "Primary-cohort table stakes plus direct demand for inspectable retained webhook evidence. Current Cloudflare viewer proves live flow but remains intentionally minimal."

  - id: capture-replay-loop
    horizon: now
    decision: must
    confidence: high
    capabilities: [replay, portable-recording, local-forwarding]
    rationale: "Repeated direct community evidence supports capture-once/replay-locally workflows and avoiding repeated real provider triggers."

  - id: configurable-sender-response
    horizon: now
    decision: must
    confidence: high
    capabilities: [custom-response, failure-simulation]
    rationale: "S007 executed response control in Webhook.site and Webhook Toolkit and response passthrough in OpenWebhook. History also shows programmable receiver responses are a long-lived sender-testing job. Keep v1 declarative and narrow rather than building a general scripting engine."

  - id: provider-aware-testing
    horizon: next
    decision: should
    confidence: medium
    capabilities: [provider-templates, signature-verification, outbound-signing]
    rationale: "Signature fidelity causes real integration failures, but provider-native CLIs are substitutes. Build cross-provider adapters rather than a Stripe-specific clone."

  - id: deterministic-ci-proof
    horizon: now
    decision: differentiation
    confidence: high
    capabilities: [wait-for-event, deterministic-ci, contracts]
    rationale: "S007 executed Hooktry's MCP and CLI Scenario flows with real HTTP, replay, assertions, persisted Outcome, and cleanup, while Webhook Toolkit executed a compact filtered wait/replay/cleanup loop. Ship a small generic wait primitive alongside the richer Scenario/Outcome proof path; deeper DSL syntax still requires usage pressure."

  - id: temporal-duplicate-proof
    horizon: validate
    decision: differentiation
    confidence: medium
    next_evidence: external_usage
    capabilities: [cardinality, correlation-context, observation-window]
    rationale: "Production bug reports validate duplicate and delivery-identity failures. Hooktry protects its real approval webhook with exact-count/idempotency/settle semantics, and Operational independently consumes a pinned Hooktry executable to verify its WebhookProviderAdapter across a repository/process/HTTP boundary. Thin first-party utility is therefore established; the next barrier is external usage, while richer ranged-cardinality and DSL depth remain hypotheses."

  - id: temporal-ordering-proof
    horizon: validate
    decision: differentiation
    confidence: medium
    next_evidence: first_party_usage
    capabilities: [ordering]
    rationale: "Production bug reports and provider behavior validate out-of-order delivery as a real failure class, and Hooktry's synthetic dogfood proves the ordering mechanism. No independent live product workflow currently needs the ordering assertion, so the next evidence remains first-party usage rather than deeper syntax."

  - id: reliable-delivery
    horizon: watch
    decision: watch
    confidence: medium
    capabilities: [durable-retries, dlq, fanout, filtering-routing, transformation]
    rationale: "Clearly validated market depth, but not yet validated as the next job for Hooktry users. Activate when development Hooks become long-lived pilots."

  - id: agent-control
    horizon: option
    decision: watch
    confidence: low
    capabilities: [approval-gate]
    rationale: "S004/S007 validate agents as a first-class actor for provisioning, waiting, inspection, replay, and cleanup, but that is distinct from generic approval/execution orchestration. Keep the existing safe control surface as an option and do not redefine Hooktry as an agent platform."

  - id: managed-compute
    horizon: substrate
    decision: out_of_scope
    confidence: high
    capabilities: [managed-compute]
    rationale: "Managed compute should remain replaceable substrate unless it directly improves the webhook verification lifecycle."
