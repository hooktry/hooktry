checked_at: 2026-10-01
scope: "Material primary-cohort products and capabilities that currently affect Hooktry webhook development/testing/pilot decisions."
projection_rule: "External product cells are present/partial only when current official evidence supports the claim. Missing evidence is unknown, not absent. Hooktry cells project the current implementation overlay."
status_vocabulary:
  present: "Current evidence supports useful implementation of the capability."
  partial: "Current evidence supports a narrower or materially incomplete implementation."
  absent: "Verified absent. Used only when absence is actually evidenced."
  unknown: "Current research does not establish the state."

products:
  - hooktry
  - webhook-site
  - hookdeck
  - webhook-relay
  - svix
  - beeceptor
  - webhooks-cc
  - hooklistener
  - webhooker
  - hook0
  - requestbin-net

